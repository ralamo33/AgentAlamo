theme="nightwolf"

[keys.normal]
"#" = "toggle_comments"    # comment/uncomment line or selection (default changed to C-c)
"%" = "match_brackets"     # Vim %  : jump to matching bracket/char
"Y" = "select_all"         # select entire file (default binding for % before it was remapped)
"0" = "goto_line_start"    # Vim 0  : first character of line
"$" = "goto_line_end"      # Vim $  : last character of line
"}" = "goto_next_paragraph"  # Vim }  : next paragraph
"{" = "goto_prev_paragraph"  # Vim {  : previous paragraph
"H" = "jump_backward"        # jumplist back (was C-p, but zellij's normal mode intercepts Ctrl-p)
"L" = "jump_forward"         # jumplist forward (was C-n, but zellij's normal mode intercepts Ctrl-n)
"C-o" = "no_op"              # freed up for remapping elsewhere
"C-i" = "no_op"              # freed up for remapping elsewhere
"C-f" = ":sh $HOME/.config/helix/bin/hx-clip-copy %{buffer_name}"  # OSC 52 clipboard copy, no xclip/pbcopy needed; quote-free so Helix's :sh tokenizer doesn't choke
"D" = "repeat_last_motion"   # was Alt-. ; ";" and "," are already taken (collapse_selection / keep_primary_selection)

[keys.insert]

[keys.select]
"#" = "toggle_comments"
"%" = "match_brackets"
"Y" = "select_all"
"0" = "goto_line_start"
"$" = "goto_line_end"
"}" = "goto_next_paragraph"
"{" = "goto_prev_paragraph"

# Tree-sitter syntax navigation minor mode (V)
[keys.normal.V]
"+" = "expand_selection"        # was Alt-o / Alt-up
"minus" = "shrink_selection"    # was Alt-i / Alt-down
"c" = "select_all_children"     # was Alt-I / Alt-Shift-down
"s" = "move_parent_node_start"  # was Alt-b
"e" = "move_parent_node_end"    # was Alt-e
"p" = "select_prev_sibling"     # was Alt-p / Alt-left
"n" = "select_next_sibling"     # was Alt-n / Alt-right
"a" = "select_all_siblings"     # was Alt-a
"f" = "flip_selections"         # was Alt-;
