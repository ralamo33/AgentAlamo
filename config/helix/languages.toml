 [[language]]
name = "python"
language-servers = ["ruff", "ty"]
auto-format = true
formatter = { command = "ruff", args = ["format", "-"]}

[language-server.ruff]
command = "ruff"
args = ["server"]


[language-server.ty]
command = "ty"
args = ["server"]

[language.debugger]
name =  "debugpy"
transport = "stdio"
command = "python3"
args = ["-m", "debugpy.adapter"]

[[language.debugger.templates]]
name = "source"
request = "launch"
completion = [
  { name = "entrypoint", completion = "filename", default = "." }
]
args = { mode = "debug", program = "{0}" }

[language-server.typescript-language-server.config]
maxTsServerMemory = 4096

[language-server.typescript-language-server.config.preferences]
importModuleSpecifierPreference = "project-relative"
preferTypeOnlyAutoImports = true
includeCompletionsForImportStatements = true
jsxAttributeCompletionStyle = "braces"

[language-server.typescript-language-server.config.completions]
completeFunctionCalls = true

# ESLint 9 defaults to flat config; Helix's built-in default pins this false and merges can't unset it.
[language-server.vscode-eslint-language-server.config]
useFlatConfig = true
experimental = { useFlatConfig = true }

[[language]]
name = "typescript"
auto-format = true
formatter = { command = "js-fmt", args = ["%{buffer_name}"] }
persistent-diagnostic-sources = ["eslint"]
language-servers = [
  { name = "typescript-language-server", except-features = ["format"] },
  "vscode-eslint-language-server",
]

